# Tesla Sensor Portfolio — Detection Dataset Configuration
# Subset of COCO focused on Tesla-relevant road objects.

# Dataset paths (override with --data flag when training)
path:  data/tesla
train: images/train
val:   images/val
test:  images/test

# Tesla-relevant COCO class IDs and names
# Only these classes are tracked in detection and fusion pipelines.
nc: 7
names:
  0: person
  2: car
  3: motorcycle
  5: bus
  7: truck
  9: traffic_light
  11: stop_sign

# LiDAR class labels (PointNet classifier)
lidar_nc: 6
lidar_names:
  0: car
  1: pedestrian
  2: cyclist
  3: truck
  4: cone
  5: background

# Performance targets
targets:
  camera_latency_ms: 50      # p99 end-to-end inference
  lidar_latency_ms:  20      # per-cloud PointNet forward pass
  fusion_latency_ms: 5       # association + merge step
  map_50:            0.50    # mAP@0.5 on Tesla val set
